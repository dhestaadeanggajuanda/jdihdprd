#     proxy_read_timeout 45s;   # sama dengan batas waktu klien (ASISTEN_TIMEOUT_MS)
# }

# ---------------------------------------------------------------------------------------------
# SPA statis. Root situs = salinan dist/spa (set `root` di vhost; direktori KHUSUS, kosong dari
# berkas lain). Header keamanan di-include di SETIAP location SPA (aturan 2). Salin
# deploy/security-headers.conf ke jalur di bawah (GANTI bila Anda menaruhnya di tempat lain).
#
# Ketiga location SPA satu paket (SPA-MULAI ... SPA-SELESAI): aktifkan bersama saat peralihan,
# nonaktifkan bersama saat rollback. `location ^~ /assets/` ikut dinonaktifkan karena /assets/
# milik situs lama (ildis_app) harus kembali dilayani ildis_app.
# ---------------------------------------------------------------------------------------------

# >>> SPA-MULAI
# Berkas berhash: cache panjang. Berkas yang tidak ada = 404 (bukan index.html).
location ^~ /assets/ {
    include /www/server/nginx/conf/jdih-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Titik masuk tidak di-cache agar rilis baru langsung dipakai.
location = /index.html {
    include /www/server/nginx/conf/jdih-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Rute SPA (mode riwayat): semua jalur yang bukan berkas jatuh ke index.html. Sengaja tanpa `$uri/`:
# folder di root (assets/, icons/) tidak boleh menimbulkan pengalihan 301 atau 403.
location / {
    include /www/server/nginx/conf/jdih-security-headers.conf;
    try_files $uri /index.html;
}
# <<< SPA-SELESAI

# ---------------------------------------------------------------------------------------------
# JALAN KEMBALI. Blok `location /` LAMA (yang meneruskan semuanya ke ildis_app) dikomentari saat
# peralihan; tempelkan salinannya persis di bawah ini, tetap berkomentar. Rollback: beri komentar
# pada SELURUH bagian SPA-MULAI ... SPA-SELESAI di atas dan buka komentar blok LAMA ini (dua
# `location /` tidak boleh hidup bersamaan), lalu `nginx -t && nginx -s reload`.
# Rinciannya: docs/deploy/frontend-baota.md, bagian Rollback.
# ---------------------------------------------------------------------------------------------
