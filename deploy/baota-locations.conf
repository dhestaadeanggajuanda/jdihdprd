# Blok `location` untuk SATU hostname produksi: jdih.dprd.singkawangkota.go.id.
# Untuk DITEMPEL ke editor "Config" situs di aaPanel/Baota (nginx di HOST, bukan container).
# Berkas ini hanya berisi `location`: listen, SSL, server_name, root, dan include milik Baota
# TIDAK ditimpa. Untuk nginx biasa di luar Baota, lihat deploy/nginx.conf (meng-include berkas ini).
# Urutan pasang bertahap, rollback, dan pemeriksaan: docs/deploy/frontend-baota.md.
#
# Pembagian jalur
#   /api/             -> 127.0.0.1:3000  container jdih_api (deploy/docker-compose.yml). Hanya GET/HEAD.
#   /backend          -> 127.0.0.1:8080  container ildis_app (dashboard admin). Jalur TIDAK dipotong. Boleh POST.
#   /feed/            -> 127.0.0.1:8080  feed JSON (dibuat ildis_cron, disajikan ildis_app).
#   /common/dokumen/  -> 127.0.0.1:8080  logo, avatar, dan PDF yang ditautkan feed.
#   selain itu        -> SPA statis (root situs = isi dist/spa) dengan fallback ke index.html.
#
# Tiga aturan yang tidak boleh dilanggar saat mengubah berkas ini:
#
# 1. Semua location awalan memakai `^~`. Vhost Baota lazimnya punya location regex (cache berkas
#    statis .js/.css/.png, penolak dotfile). Tanpa `^~`, regex itu MENANG atas awalan biasa dan
#    mencuri /backend/assets/x.js serta /common/dokumen/logo.png (dilayani dari root SPA, bukan
#    dari ildis_app).
#
# 2. Header keamanan SPA (deploy/security-headers.conf) di-include HANYA di location SPA. Jangan di
#    tingkat server dan jangan di /api/, /backend, /feed/, /common/dokumen/. nginx mewarisi add_header
#    dari tingkat server ke location yang tidak punya add_header sendiri, dan satu add_header di
#    sebuah location membuang SEMUA add_header tingkat server untuk location itu (karena itu header SPA
#    di-include ulang di tiap location SPA). CSP SPA (script-src 'self') akan merusak dashboard
#    /backend, yang memuat skrip dan CSS dari cdn.jsdelivr.net.
#
# 3. proxy_pass ke ildis_app TANPA URI (tidak ada "/" atau jalur setelah :8080): jalur diteruskan
#    apa adanya. Jangan "memperbaiki" header proxy atau pengalihan: rantai pengalihan /backend yang
#    sekarang (301 -> 302 ke skema http -> 301 kembali ke https -> 200) memang begitu, dan
#    header proxy di bawah harus sama persis dengan vhost lama.
#
# Penanda GANTI_... / "GANTI:" = nilai yang harus Anda isi dari server sendiri.


# ---------------------------------------------------------------------------------------------
# API (container jdih_api). Port = API_PORT di deploy/.env (hanya dipublikasikan ke loopback).
# ---------------------------------------------------------------------------------------------
location ^~ /api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # TIMPA (bukan $proxy_add_x_forwarded_for): API memakai header ini untuk batas laju per IP,
    # jadi nilai kiriman klien tidak boleh ikut.
    #
    # TRUST_PROXY di sisi API = alamat yang TERLIHAT oleh API sebagai asal sambungan dari nginx.
    #  - Docker (deploy/docker-compose.yml): nginx di host menyambung ke port yang dipublikasikan,
    #    dan API melihat sambungan itu berasal dari GATEWAY jaringan baota_net, BUKAN 127.0.0.1.
    #    Isi TRUST_PROXY dengan gateway itu (cara memastikan: deploy/.env.example).
    #  - Tanpa Docker (API di host yang sama): TRUST_PROXY=loopback.
    # Salah mengisi tidak membuka celah, tetapi semua klien berbagi satu keranjang batas laju
    # (kunci = alamat nginx/gateway), sehingga pengunjung saling memblokir.
    # Bila ada CDN/penyeimbang beban di depan nginx, pulihkan IP klien dulu dengan
    # ngx_http_realip_module (set_real_ip_from), kalau tidak semua klien tampak satu IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
    # Berkas dokumen: pada deploy Docker (FILES_MODE=stream) API sendiri yang membaca volume
    # read-only dan mengalirkannya lewat sini; jalur berkas tidak pernah ditentukan klien.
    # Tanpa add_header di sini (aturan 2). Bila vhost punya add_header tingkat server, header itu
    # ikut terbawa ke respons API: cek dengan `curl -I https://HOST/api/v1/ringkasan`.
}


# ---------------------------------------------------------------------------------------------
# ildis_app (aplikasi lama: dashboard admin, feed JSON, berkas dokumen). TANPA limit_except:
# login dan unggah PDF memakai POST. Tanpa header keamanan SPA (aturan 2).
#
# Baris di antara penanda SALIN-DARI-VHOST-LAMA harus sama persis dengan yang dipakai vhost
# sekarang untuk meneruskan ke ildis_app (Host, X-Real-IP, X-Forwarded-*, timeout, dsb.).
# Isi di bawah hanyalah dasar yang umum di Baota dan BELUM dicocokkan dengan vhost Anda.
# Ketiga blok harus memuat baris yang sama.
# ---------------------------------------------------------------------------------------------
location ^~ /backend {
    # >>> SALIN-DARI-VHOST-LAMA
    client_max_body_size 50m;   # GANTI: samakan dengan vhost sekarang (batas unggah PDF)
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    # <<< SALIN-DARI-VHOST-LAMA
}

location ^~ /feed/ {
    # >>> SALIN-DARI-VHOST-LAMA
    client_max_body_size 50m;   # GANTI: samakan dengan vhost sekarang (batas unggah PDF)
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    # <<< SALIN-DARI-VHOST-LAMA
}

location ^~ /common/dokumen/ {
    # >>> SALIN-DARI-VHOST-LAMA
    client_max_body_size 50m;   # GANTI: samakan dengan vhost sekarang (batas unggah PDF)
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    # <<< SALIN-DARI-VHOST-LAMA
}


# ---------------------------------------------------------------------------------------------
# Asisten JDIH (OPSIONAL, DIKOMENTARI). Aktifkan HANYA bila layanan Asisten sudah ada DAN
# JDIH_ASISTEN_URL=/asisten/chat diisi saat build. Selama JDIH_ASISTEN_URL kosong, aplikasi tidak
# menampilkan tombol Asisten dan tidak pernah memanggil jalur ini, jadi blok ini tidak dibutuhkan.
#
# Kontrak (sama dengan agent-jdih): POST /chat, JSON { "question": "3-500 karakter" } ->
# { "answer", "sources": [...], "disclaimer" }. Aplikasi memanggil /asisten/chat di origin yang sama
# (CSP tidak berubah: connect-src 'self'). Layanan Asisten sendiri TIDAK ada di repo ini.
#
# - location SAMA PERSIS (`=`), bukan awalan /asisten/: layanan seperti agent-jdih juga punya
#   jalur admin (/admin/...) yang tidak boleh terjangkau dari internet.
# - Hanya POST; badan permintaan dibatasi kecil; batas laju per IP (zona limit_req di blok http):
#       limit_req_zone $binary_remote_addr zone=jdih_asisten:10m rate=10r/m;
# - Tanpa header keamanan SPA (ini respons JSON, bukan halaman) dan tanpa add_header apa pun.
# - X-Forwarded-For ditimpa (bukan ditambah) agar IP klien yang dicatat layanan tidak bisa dipalsukan.
# - Sama seperti /api/: aplikasi Android (origin https://localhost) akan lintas origin dan butuh
#   CORS; karena itu Asisten sengaja hanya tampil di web (WhatsApp tetap ada di Android).
#
# location = /asisten/chat {
#     limit_except POST { deny all; }
#     client_max_body_size 4k;
#     limit_req zone=jdih_asisten burst=5 nodelay;
#     proxy_pass http://127.0.0.1:GANTI_PORT_ASISTEN/chat;   # GANTI: alamat layanan Asisten (loopback)
