# Contoh vhost LENGKAP untuk nginx biasa (di luar Baota) yang melayani SATU hostname produksi:
# SPA statis (dist/spa, mode riwayat), /api/ ke container jdih_api, dan /backend, /feed/,
# /common/dokumen/ ke container ildis_app. Semua `location` ada di deploy/baota-locations.conf,
# satu-satunya sumber (berkas ini hanya membungkusnya), supaya tidak ada dua salinan yang menyimpang.
#
# DI BAOTA berkas ini TIDAK dipakai: situs dibuat lewat panel (listen, SSL, root, redirect HTTP->HTTPS
# dikelola Baota) dan isi deploy/baota-locations.conf ditempel ke editor "Config" situs.
# Langkah, urutan peralihan bertahap, dan rollback: docs/deploy/frontend-baota.md.

server {
    listen 443 ssl;
    http2 on;
    server_name jdih.dprd.singkawangkota.go.id;

    ssl_certificate     /etc/letsencrypt/live/GANTI_HOST/fullchain.pem;   # GANTI
    ssl_certificate_key /etc/letsencrypt/live/GANTI_HOST/privkey.pem;     # GANTI

    # Salinan dist/spa (hanya baca untuk pengguna nginx). Direktori khusus.
    root /var/www/jdih-spa;   # GANTI
    index index.html;
    server_tokens off;

    # TIDAK ada add_header di tingkat server: header keamanan SPA hanya di-include di location SPA
    # (lihat aturan 2 di baota-locations.conf).
    include /etc/nginx/jdih/baota-locations.conf;   # GANTI: jalur salinan deploy/baota-locations.conf
}

server {
    listen 80;
    server_name jdih.dprd.singkawangkota.go.id;
    return 301 https://$host$request_uri;
}
