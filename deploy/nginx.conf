# Contoh konfigurasi nginx untuk jdih.dprd.singkawangkota.go.id.
# Melayani SPA hasil `npm run build` (dist/spa, mode riwayat) dan meneruskan
# /api/ ke service API Node (api/, lihat api/README.md). Sesuaikan jalur dan sertifikat.
#
# Server ini baru menggantikan situs Yii2 lama setelah API siap. Selama masa
# peralihan, pasang di host terpisah atau di bawah subpath yang disepakati.

server {
    listen 443 ssl;
    http2 on;
    server_name jdih.dprd.singkawangkota.go.id;

    # ssl_certificate     /etc/letsencrypt/live/jdih.dprd.singkawangkota.go.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jdih.dprd.singkawangkota.go.id/privkey.pem;

    root /var/www/jdih/dist/spa;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/jdih-security-headers.conf;   # salin dari deploy/security-headers.conf

    # Berkas statis berhash: cache panjang.
    location /assets/ {
        include /etc/nginx/snippets/jdih-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Titik masuk tidak di-cache agar rilis baru langsung dipakai.
    location = /index.html {
        include /etc/nginx/snippets/jdih-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rute SPA (mode riwayat): semua jalur yang bukan berkas jatuh ke index.html.
    location / {
        include /etc/nginx/snippets/jdih-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Service API (Node + Fastify). Hanya GET dan HEAD yang diteruskan.
    location /api/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        # Respons berkas: API membalas X-Accel-Redirect ke lokasi internal di bawah,
        # sehingga jalur berkas tidak pernah ditentukan klien.
    }

    # Hanya dapat dicapai lewat X-Accel-Redirect dari API (internal), tidak dari klien.
    # Content-Type dan Content-Disposition (nama berkas) dibawa dari respons API.
    # JANGAN menambah Content-Disposition di sini: dua header yang berbeda ditolak Chrome
    # (ERR_RESPONSE_HEADERS_MULTIPLE_CONTENT_DISPOSITION). X-Content-Type-Options dari API
    # tidak diteruskan nginx pada X-Accel-Redirect, jadi ditambahkan di sini.
    location /internal-dokumen/ {
        internal;
        alias /path/ke/common/dokumen/;   # folder berkas dokumen (hanya baca)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
}

server {
    listen 80;
    server_name jdih.dprd.singkawangkota.go.id;
    return 301 https://$host$request_uri;
}
