# Header keamanan untuk SPA. Di-include HANYA pada location SPA (/, /assets/, /index.html;
# lihat deploy/baota-locations.conf), di tiap location itu: nginx membuang add_header tingkat
# atas bila sebuah `location` mendefinisikan add_header sendiri. JANGAN di-include di tingkat
# server atau di /api/, /backend, /feed/, /common/dokumen/ (CSP ini merusak dashboard /backend
# yang memuat skrip dari cdn.jsdelivr.net).
#
# CSP penuh (termasuk frame-ancestors, yang tidak bisa lewat <meta>). Harus
# selaras dengan CSP di index.html (quasar.config.js -> htmlVariables.csp); diuji oleh
# tests/unit/csp-selaras.test.js.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://jdih.dprd.singkawangkota.go.id https://mediacenter.singkawangkota.go.id; font-src 'self'; connect-src 'self' https://jdih.dprd.singkawangkota.go.id https://mediacenter.singkawangkota.go.id; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
