openapi: 3.0.3
info:
  title: API JDIH DPRD Kota Singkawang
  version: 1.0.0
  description: |
    Kontrak antara aplikasi (web dan Android) dan service API terpisah yang
    membaca database JDIH (implementasi: `api/`, lihat `api/README.md`). Pemetaan
    ke kolom database sudah direkonsiliasi dengan DDL `design/db_jdihdprd.sql`;
    asumsi yang masih perlu dicocokkan dengan data produksi tercantum di
    `api/README.md`. Kontrak ini dipakai klien (`src/services`) dan API palsu
    pengembangan (`dev/mock-api`).

    Prinsip keamanan (OWASP API Top 10):
    - **Hanya GET (dan HEAD)**. Metode lain dijawab 405. Tidak ada autentikasi dan
      tidak ada penulisan lewat API publik.
    - Skema respons adalah **allowlist kolom** (API3): kolom di luar skema tidak
      pernah dikirim.
    - Parameter divalidasi dengan skema, `per_page` maksimal 50, `page` maksimal
      1000, `q` 2 sampai 100 karakter (API4). Rate limit per IP, 429 bila terlampaui.
    - Parameter bilangan bulat (`page`, `per_page`, `tahun_dari`, `tahun_sampai`) harus
      berupa 1 sampai 5 digit desimal polos; `Infinity`, `1e3`, `+1`, `1.5`, spasi, atau
      parameter ganda dijawab 400. (Koersi tipe Ajv meloloskan `Infinity` melewati batas
      rentang, jadi pemeriksaan ini dilakukan sebelum validasi skema.)
    - Berkas diunduh lewat **ID buram**, bukan nama berkas atau jalur dari klien.
      Jalur berkas selalu berasal dari database di sisi server.
    - CORS memakai allowlist origin (origin web dan `https://localhost` untuk
      Android Capacitor), bukan `*`.
    - Galat memakai `application/problem+json`, tanpa jejak tumpukan. Setiap respons
      membawa `X-Request-Id` untuk korelasi dengan log server.
servers:
  - url: https://jdih.dprd.singkawangkota.go.id/api/v1
    description: Produksi
  - url: http://localhost:9000/api/v1
    description: API palsu pengembangan (quasar dev)
tags:
  - name: Dokumen
  - name: Referensi
  - name: Statistik
  - name: Halaman
paths:
  /ringkasan:
    get:
      tags: [Dokumen]
      summary: Ringkasan beranda
      description: Jumlah per koleksi dan beberapa produk hukum terbaru.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [koleksi, terbaru]
                    properties:
                      koleksi:
                        type: array
                        items: { $ref: '#/components/schemas/Koleksi' }
                      terbaru:
                        type: array
                        maxItems: 12
                        items: { $ref: '#/components/schemas/DokumenRingkas' }
                  meta: { $ref: '#/components/schemas/MetaTanda' }
        default: { $ref: '#/components/responses/Galat' }
  /dokumen:
    get:
      tags: [Dokumen]
      summary: Cari dan telusuri dokumen
      parameters:
        - {
            name: q,
            in: query,
            description: Kata kunci,
            atau pola nomor/tahun seperti `7/2019`,
            schema: { type: string, minLength: 2, maxLength: 100 }
          }
        - {
            name: tipe,
            in: query,
            schema:
              {
                type: string,
                enum: [peraturan, monografi, artikel, putusan],
                default: peraturan
              }
          }
        - {
            name: jenis,
            in: query,
            description: Kode jenis peraturan (lihat /referensi/jenis-peraturan),
            schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [berlaku, dicabut] }
          }
        - {
            name: diubah,
            in: query,
            description: '`1` = hanya yang pernah diubah',
            schema: { type: string, enum: ['1'] }
          }
        - {
            name: nomor,
            in: query,
            schema: { type: string, pattern: '^[0-9A-Za-z/.-]{1,20}$' }
          }
        - {
            name: tahun_dari,
            in: query,
            schema: { type: integer, minimum: 1900, maximum: 2100 }
          }
        - {
            name: tahun_sampai,
            in: query,
            schema: { type: integer, minimum: 1900, maximum: 2100 }
          }
        - { name: subyek, in: query, schema: { type: string, maxLength: 60 } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [terbaru, nomor, populer],
                default: terbaru
              }
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
          }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DokumenRingkas' }
                  meta: { $ref: '#/components/schemas/Halaman' }
        '400': { $ref: '#/components/responses/Galat' }
        '429': { $ref: '#/components/responses/Galat' }
        default: { $ref: '#/components/responses/Galat' }
  /dokumen/{id}:
    get:
      tags: [Dokumen]
      summary: Detail dokumen
      parameters:
        - { $ref: '#/components/parameters/DokumenId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DokumenDetail' }
                  meta: { $ref: '#/components/schemas/MetaTanda' }
        '404': { $ref: '#/components/responses/Galat' }
        default: { $ref: '#/components/responses/Galat' }
  /dokumen/{id}/lampiran/{lampiranId}:
    get:
      tags: [Dokumen]
      summary: Unduh berkas (PDF)
      description: |
        Dilayani dengan `Content-Disposition: attachment` dan `X-Content-Type-Options: nosniff`.
        `lampiranId` adalah ID buram dari `berkas.lampiran_id` atau `lampiran[].id`; server
        memetakannya ke jalur berkas dari database dan memastikan berkas milik `id`.
        Direkomendasikan memakai `X-Accel-Redirect` (nginx) agar Node tidak melayani byte berkas.
      parameters:
        - { $ref: '#/components/parameters/DokumenId' }
        - {
            name: lampiranId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          }
      responses:
        '200':
          description: Berkas PDF
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Galat' }
  /referensi/{nama}:
    get:
      tags: [Referensi]
      summary: Daftar acuan untuk filter
      parameters:
        - {
            name: nama,
            in: path,
            required: true,
            schema: { type: string, enum: [jenis-peraturan, status, tipe] }
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Acuan' }
        '404': { $ref: '#/components/responses/Galat' }
  /puu:
    get:
      tags: [Dokumen]
      summary: Kategori dokumen pembentukan peraturan perundang-undangan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Acuan' }
  /puu/{kategori}:
    get:
      tags: [Dokumen]
      summary: Dokumen pada satu kategori PUU
      parameters:
        - {
            name: kategori,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
          }
        - {
            name: per_page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DokumenRingkas' }
                  meta: { $ref: '#/components/schemas/Halaman' }
        '404': { $ref: '#/components/responses/Galat' }
  /statistik:
    get:
      tags: [Statistik]
      summary: Statistik koleksi dan aktivitas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Statistik' }
                  meta: { $ref: '#/components/schemas/MetaTanda' }
  /halaman:
    get:
      tags: [Halaman]
      summary: Daftar halaman Tentang Kami
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [slug, judul]
                      properties:
                        slug: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
                        judul: { type: string, maxLength: 160 }
                        grup:
                          {
                            type: string,
                            nullable: true,
                            description: Judul grup bila halaman berada di bawah grup
                          }
                        tingkat: { type: integer, minimum: 0, maximum: 3 }
  /halaman/{slug}:
    get:
      tags: [Halaman]
      summary: Isi satu halaman
      description: |
        `isi_html` berasal dari editor di backend dan **tidak dipercaya**: klien selalu
        membersihkannya (DOMPurify, allowlist ketat) sebelum menampilkannya.
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [slug, judul, isi_html]
                    properties:
                      slug: { type: string }
                      judul: { type: string }
                      isi_html:
                        {
                          type: string,
                          maxLength: 200000,
                          description: 'Kosong untuk halaman berbasis berkas (lihat `berkas`).'
                        }
                      diperbarui: { type: string, format: date, nullable: true }
                      berkas:
                        type: object
                        nullable: true
                        description: |
                          Hanya untuk halaman berbasis berkas (struktur organisasi, SOP):
                          berkasnya dilayani oleh `/halaman/{slug}/berkas`.
                        properties:
                          tipe: { type: string, enum: [gambar, pdf] }
                          nama:
                            {
                              type: string,
                              description: Nama berkas untuk tampilan
                            }
        '404': { $ref: '#/components/responses/Galat' }
  /halaman/{slug}/berkas:
    get:
      tags: [Halaman]
      summary: Berkas (gambar atau PDF) milik halaman berbasis berkas
      description: |
        Nama berkas berasal dari database dan divalidasi (tanpa pemisah jalur, ekstensi
        allowlist); jalur akhir dipastikan tetap berada di `PAGE_FILES_DIR` (realpath).
        Gambar dilayani `inline`, PDF sebagai `attachment`; keduanya dengan
        `X-Content-Type-Options: nosniff` dan `Content-Security-Policy: default-src 'none'; sandbox`.
      parameters:
        - {
            name: slug,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
          }
      responses:
        '200':
          description: Berkas gambar atau PDF
          content:
            image/*: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Galat' }
components:
  parameters:
    DokumenId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^\d{1,10}$' }
  responses:
    Galat:
      description: Galat (RFC 9457)
      headers:
        X-Request-Id:
          {
            schema: { type: string },
            description: ID permintaan untuk korelasi log
          }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Masalah' }
  schemas:
    Masalah:
      type: object
      required: [title, status]
      properties:
        type: { type: string, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail:
          {
            type: string,
            description: 'Tidak memuat detail internal (SQL, jalur berkas, jejak tumpukan).'
          }
    MetaTanda:
      type: object
      properties:
        sample:
          {
            type: boolean,
            description: 'Hanya pada API palsu pengembangan: data contoh.'
          }
    Halaman:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
        sample: { type: boolean }
    Acuan:
      type: object
      required: [kode, nama]
      properties:
        kode:
          {
            type: string,
            pattern: '^[A-Za-z0-9_-]{1,64}$',
            description: Slug stabil yang dipakai sebagai parameter filter
          }
        nama: { type: string }
        jumlah: { type: integer, minimum: 0 }
    Koleksi:
      type: object
      required: [tipe, nama, jumlah]
      properties:
        tipe: { type: string, enum: [peraturan, monografi, artikel, putusan] }
        nama: { type: string }
        deskripsi: { type: string, nullable: true }
        jumlah: { type: integer }
        berlaku: { type: integer, description: Hanya untuk peraturan }
        dicabut: { type: integer, description: Hanya untuk peraturan }
    Berkas:
      type: object
      required: [lampiran_id]
      properties:
        lampiran_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        ukuran: { type: integer, description: Byte }
    DokumenRingkas:
      description: |
        **Pemetaan**: `jenis`/`singkatan` dari `document.jenis_peraturan`; `status` dari
        `document.status` atau relasi "dicabut" ke dokumen terbit (`data_status`); `diubah` bila
        ada relasi "diubah" ke dokumen terbit; `riwayat` ringkasan satu baris relasi terpenting;
        `berkas` dari lampiran utama (`data_lampiran`). Rincian konvensi: `api/README.md`.
      type: object
      required: [id, tipe, jenis]
      properties:
        id: { type: string, pattern: '^\d{1,10}$' }
        tipe: { type: string, enum: [peraturan, monografi, artikel, putusan] }
        jenis: { type: string, example: Peraturan Daerah }
        singkatan: { type: string, nullable: true, example: Perda }
        nomor: { type: string, nullable: true, example: '7' }
        tahun: { type: integer, nullable: true, example: 2019 }
        judul:
          {
            type: string,
            description: 'Isi "tentang" tanpa awalan jenis dan nomor.'
          }
        status:
          {
            type: string,
            enum: [berlaku, dicabut],
            nullable: true,
            description: 'null untuk koleksi tanpa status keberlakuan.'
          }
        diubah: { type: boolean }
        riwayat:
          {
            type: string,
            nullable: true,
            example: Diubah oleh Peraturan Daerah Nomor 5 Tahun 2022
          }
        tanggal_penetapan: { type: string, format: date, nullable: true }
        pemrakarsa: { type: string, nullable: true }
        berkas:
          { allOf: [{ $ref: '#/components/schemas/Berkas' }], nullable: true }
    Relasi:
      type: object
      required: [id, jenis]
      properties:
        id: { type: string }
        jenis: { type: string }
        nomor: { type: string, nullable: true }
        tahun: { type: integer, nullable: true }
        judul: { type: string }
        status: { type: string, enum: [berlaku, dicabut], nullable: true }
    DokumenDetail:
      allOf:
        - $ref: '#/components/schemas/DokumenRingkas'
        - type: object
          properties:
            tanggal_pengundangan: { type: string, format: date, nullable: true }
            tempat_terbit: { type: string, nullable: true }
            bahasa: { type: string, nullable: true }
            sumber: { type: string, nullable: true }
            bidang_hukum: { type: string, nullable: true }
            dilihat: { type: integer }
            diunduh: { type: integer }
            kutipan:
              {
                type: string,
                nullable: true,
                description: Cara mengutip,
                disusun server
              }
            status_keterangan:
              {
                type: string,
                nullable: true,
                description: Penjelasan status satu atau dua kalimat
              }
            riwayat_status:
              type: array
              description: Dari yang terbaru. `saat_ini` menandai peristiwa yang menentukan status sekarang.
              items:
                type: object
                required: [keterangan]
                properties:
                  tanggal: { type: string, format: date, nullable: true }
                  keterangan: { type: string }
                  saat_ini: { type: boolean }
            relasi:
              type: object
              properties:
                mencabut:
                  {
                    type: array,
                    items: { $ref: '#/components/schemas/Relasi' }
                  }
                dicabut_oleh:
                  {
                    type: array,
                    items: { $ref: '#/components/schemas/Relasi' }
                  }
                mengubah:
                  {
                    type: array,
                    items: { $ref: '#/components/schemas/Relasi' }
                  }
                diubah_oleh:
                  {
                    type: array,
                    items: { $ref: '#/components/schemas/Relasi' }
                  }
            teu:
              type: array
              description: T.E.U. Badan
              items:
                type: object
                properties:
                  nama: { type: string }
                  jenis: { type: string }
            subjek: { type: array, items: { type: string } }
            lampiran:
              type: array
              items:
                type: object
                required: [id, nama]
                properties:
                  id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
                  nama: { type: string }
                  ukuran: { type: integer }
                  peran: { type: string, enum: [utama, abstrak, lampiran] }
    Statistik:
      type: object
      required: [kpi, per_koleksi, status_peraturan, per_jenis, per_tahun]
      properties:
        kpi:
          type: object
          required:
            [
              total,
              peraturan_berlaku,
              peraturan_total,
              dilihat_30h,
              diunduh_30h
            ]
          properties:
            total: { type: integer }
            peraturan_berlaku: { type: integer }
            peraturan_total: { type: integer }
            dilihat_30h: { type: integer }
            diunduh_30h: { type: integer }
        per_koleksi:
          type: array
          items:
            {
              type: object,
              properties: { nama: { type: string }, jumlah: { type: integer } }
            }
        status_peraturan:
          type: object
          properties:
            berlaku:
              { type: integer, description: Berlaku dan belum pernah diubah }
            berlaku_diubah: { type: integer }
            dicabut: { type: integer }
        per_jenis:
          type: array
          items:
            {
              type: object,
              properties: { nama: { type: string }, jumlah: { type: integer } }
            }
        per_tahun:
          type: array
          items:
            type: object
            properties:
              tahun: { type: integer }
              jumlah: { type: integer }
              berjalan: { type: boolean, description: Tahun yang belum selesai }
